
{% extends "base.html" %}
{% block title %}OSDU Record Explorer{% endblock %}

{% block content %}

<style>
/* ── Explorer layout ────────────────────────────────────────────────── */
.ex-wrap        { max-width: 96rem; }
.ex-panel       { border: 1px solid #e1dfdd; border-radius: 8px; background: #fff; padding: .75rem 1rem; margin-bottom: 1rem; }
.ex-panel h3    { margin: 0 0 .5rem 0; font-size: 1.05rem; color: #323130; }
.ex-row         { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
.ex-row label   { font-size: .85rem; color: #605e5c; display: block; margin-bottom: 2px; }
.ex-row .field  { display: flex; flex-direction: column; }
.muted          { color: #605e5c; }
.btn            { display: inline-block; padding: .35rem .7rem; border: 1px solid #605e5c;
                  border-radius: 3px; background: #fff; cursor: pointer; font-size: .9rem; }
.btn:hover      { background: #f3f2f1; }
.btn-primary    { background: #0078d4; color: #fff; border-color: #0078d4; }
.btn-primary:hover { background: #106ebe; }
.error          { background: #fde7e9; border-left: 4px solid #d13438; padding: .5rem .75rem; border-radius: 4px; margin: .5rem 0; }

/* Search results list */
#results-list   { list-style: none; padding: 0; margin: .5rem 0 0 0; max-height: 14rem; overflow-y: auto;
                  border: 1px solid #e1dfdd; border-radius: 4px; }
#results-list li { padding: .4rem .6rem; cursor: pointer; border-bottom: 1px solid #f3f2f1;
                   display: flex; justify-content: space-between; align-items: center; }
#results-list li:last-child { border-bottom: none; }
#results-list li:hover { background: #f3f2f1; }
#results-list li.active { background: #deecf9; }
#results-list .res-name  { font-weight: 600; }
#results-list .res-kind  { font-size: .8rem; color: #605e5c; background: #f3f2f1;
                           padding: 1px 6px; border-radius: 10px; white-space: nowrap; }

/* Detail section */
#detail-section { display: none; }
.detail-title   { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.detail-title h2 { margin: 0; }
.detail-title .kind-badge { font-size: .85rem; color: #605e5c; background: #f3f2f1;
                            padding: 2px 8px; border-radius: 10px; }

/* Graph */
.graph-wrap     { overflow-x: auto; background: #fafafa; border: 1px solid #e1dfdd; border-radius: 6px; padding: .5rem; }
.graph-wrap svg { max-width: 100%; height: auto; }

/* Metadata */
.meta-sections  { display: grid; grid-template-columns: repeat(auto-fit, minmax(30rem, 1fr)); gap: .75rem; }
.meta-card      { border: 1px solid #e1dfdd; border-radius: 6px; padding: .5rem .75rem; background: #fff; }
.meta-card h4   { margin: 0 0 .35rem; font-size: .95rem; color: #323130; border-bottom: 1px solid #edebe9; padding-bottom: .25rem; }
.meta-card table { width: 100%; }
.meta-card td   { padding: 3px 6px; vertical-align: top; word-break: break-all; }
.meta-card .mk  { font-weight: 600; color: #323130; white-space: nowrap; width: 14rem; }
.meta-card .mv  { color: #605e5c; }
.meta-card .mv a { color: #0078d4; cursor: pointer; text-decoration: underline; }
.meta-card .mv a:hover { color: #106ebe; }

/* Data table */
.data-table-wrap { overflow-x: auto; }
.data-table     { border-collapse: collapse; width: 100%; font-size: .85rem; }
.data-table th  { background: #f3f2f1; position: sticky; top: 0; z-index: 1;
                  border-bottom: 2px solid #999; padding: 4px 8px; text-align: left; white-space: nowrap; }
.data-table td  { padding: 3px 8px; border-bottom: 1px solid #edebe9; }
.data-table tr:hover { background: #f9f9f9; }
.data-table .key-col { background: #fafafa; font-weight: 500; }

/* Toolbar row */
.toolbar { display: flex; gap: .5rem; align-items: center; margin: .35rem 0; flex-wrap: wrap; }
.toolbar input[type=text] { flex: 1; max-width: 20rem; padding: 4px 8px; }
</style>

<div class="ex-wrap">
  <h2>Record Explorer</h2>

  <!-- ═══════════ SEARCH ═══════════ -->
  <section class="ex-panel">
    <h3>Search OSDU Records</h3>
    <div class="ex-row">
      <div class="field">
        <label for="kind-select">Type</label>
        <select id="kind-select" style="min-width:18rem">
          {% for t in types %}
            <option value="{{ t.kind }}">{{ t.label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field" style="flex:1;min-width:10rem">
        <label for="search-q">Query</label>
        <input id="search-q" type="text" value="*" placeholder="e.g. data.Name:Drogon OR *">
      </div>
      <div class="field" style="width:5rem">
        <label for="search-limit">Limit</label>
        <input id="search-limit" type="number" value="50" min="1" max="500">
      </div>
      <button class="btn btn-primary" id="btn-search" type="button">Search</button>
    </div>
    <div id="search-status" class="muted" style="margin-top:.35rem;font-size:.85rem;"></div>
    <ul id="results-list">
      <li class="muted" style="justify-content:center;cursor:default;">No results yet</li>
    </ul>
  </section>

  <!-- ═══════════ DETAIL ═══════════ -->
  <section id="detail-section">

    <!-- Title bar -->
    <div class="detail-title" style="margin-bottom:.5rem;">
      <h2 id="detail-name">—</h2>
      <span class="kind-badge" id="detail-kind"></span>
    </div>
    <div class="muted" style="font-size:.8rem;margin-bottom:.75rem;" id="detail-id"></div>

    <!-- Relationship graph -->
    <div class="ex-panel">
      <h3>Relationships</h3>
      <div class="graph-wrap">
        <div id="mermaid-container"></div>
      </div>
    </div>

    <!-- Metadata -->
    <div class="ex-panel">
      <h3>Properties</h3>
      <div class="toolbar">
        <input type="text" id="meta-filter" placeholder="Filter properties...">
        <button class="btn" id="meta-copy" type="button">Copy CSV</button>
      </div>
      <div class="meta-sections" id="meta-container"></div>
    </div>

    <!-- Table data (Volumes / ColumnBasedTable) -->
    <div class="ex-panel" id="table-section" style="display:none;">
      <h3 id="table-title">Table Data</h3>
      <div class="toolbar">
        <input type="text" id="table-filter" placeholder="Filter rows...">
        <span class="muted" id="table-info"></span>
      </div>
      <div class="data-table-wrap" style="max-height:60vh;overflow:auto;">
        <table class="data-table" id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<!-- ═══════════ JAVASCRIPT ═══════════ -->
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const kindSel    = $('#kind-select');
const qInput     = $('#search-q');
const limitInput = $('#search-limit');
const btnSearch  = $('#btn-search');
const statusEl   = $('#search-status');
const resultsList = $('#results-list');
const detailSec  = $('#detail-section');

// ── Color map for type-based Mermaid styling ──
const TYPE_COLORS = {
  'Reservoir':                   { fill: '#cfe2ff', stroke: '#084298' },
  'ReservoirSegment':            { fill: '#d1ecf1', stroke: '#0c5460' },
  'work-product':                { fill: '#fff3cd', stroke: '#d39e00' },
  'ReservoirEstimatedVolumes':   { fill: '#d4edda', stroke: '#155724' },
  'ColumnBasedTable':            { fill: '#d1ecf1', stroke: '#0c5460' },
  'Risk':                        { fill: '#f5c6cb', stroke: '#721c24' },
  'BusinessDecision':            { fill: '#e2d9f3', stroke: '#5a3e85' },
  'StratigraphicColumn':         { fill: '#fce4ec', stroke: '#880e4f' },
};
const ROLE_COLORS = {
  'ancestry-parent':    { fill: '#cfe2ff', stroke: '#084298' },
  'ancestry-child':     { fill: '#e2e3e5', stroke: '#6c757d' },
  'prior-activity':     { fill: '#fff3cd', stroke: '#d39e00' },
  'parameter-object':   { fill: '#d1ecf1', stroke: '#0c5460' },
  'parent-object':      { fill: '#f8d7da', stroke: '#721c24' },
  'parent-work-product':{ fill: '#f8d7da', stroke: '#721c24' },
  'risk':               { fill: '#f5c6cb', stroke: '#721c24' },
  'ref':                { fill: '#e9ecef', stroke: '#6c757d' },
};

function escMermaid(s) {
  return (s || '').replace(/[\[\]"{}|<>\\]/g, c => '&#' + c.charCodeAt(0) + ';')
                  .replace(/\n/g, ' ').replace(/\r/g, '');
}

function shortId(id) {
  // "dev:master-data--Reservoir:5b8dc759-...:1" → last UUID segment
  if (!id) return '';
  const parts = id.split(':');
  if (parts.length >= 3) {
    const uuid = parts[parts.length - 2] || parts[parts.length - 1];
    return uuid.length > 12 ? uuid.substring(0, 8) + '…' : uuid;
  }
  return id.length > 20 ? id.substring(0, 18) + '…' : id;
}

// ── SEARCH ──
let currentItems = [];

async function doSearch() {
  const kind = kindSel.value;
  const q = (qInput.value || '*').trim();
  const limit = Math.max(1, Math.min(500, parseInt(limitInput.value || '50', 10)));
  statusEl.textContent = 'Searching…';
  resultsList.innerHTML = '<li class="muted" style="justify-content:center;cursor:default">Searching…</li>';
  detailSec.style.display = 'none';
  statusEl.textContent = 'Searching…';

  try {
    const url = `/api/strat/search.json?kind=${encodeURIComponent(kind)}&q=${encodeURIComponent(q)}&limit=${limit}`;
    const r = await fetch(url, { headers: { 'Cache-Control': 'no-store' } });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    const data = await r.json();
    currentItems = data.items || [];
    statusEl.textContent = `Found ${data.total ?? currentItems.length} record(s)`;

    if (!currentItems.length) {
      resultsList.innerHTML = '<li class="muted" style="justify-content:center;cursor:default">No results</li>';
      return;
    }
    resultsList.innerHTML = '';
    for (const it of currentItems) {
      const li = document.createElement('li');
      li.dataset.id = it.id;
      li.innerHTML = `<span class="res-name">${esc(it.name)}</span><span class="res-kind">${esc(it.short_kind)}</span>`;
      li.addEventListener('click', () => selectResult(it.id, li));
      resultsList.appendChild(li);
    }
    // Auto-select first
    const first = resultsList.querySelector('li');
    if (first) selectResult(currentItems[0].id, first);
  } catch (e) {
    console.warn(e);
    statusEl.textContent = 'Search failed: ' + e.message;
    resultsList.innerHTML = '<li class="muted" style="justify-content:center;cursor:default">Error</li>';
  }
}

function selectResult(id, li) {
  $$('#results-list li').forEach(el => el.classList.remove('active'));
  if (li) li.classList.add('active');
  loadRecord(id);
}

btnSearch?.addEventListener('click', doSearch);
qInput?.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── LOAD RECORD ──
let currentRecord = null;

async function loadRecord(id) {
  detailSec.style.display = 'none';
  statusEl.textContent = 'Loading record…';
  try {
    const url = `/api/strat/record.json?id=${encodeURIComponent(id)}`;
    const r = await fetch(url, { headers: { 'Cache-Control': 'no-store' } });
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    currentRecord = await r.json();
    await renderDetail(currentRecord);
    detailSec.style.display = 'block';
    statusEl.textContent = '';
  } catch (e) {
    console.warn('loadRecord error:', e);
    statusEl.textContent = 'Load failed: ' + e.message;
  }
}

async function renderDetail(rec) {
  // Title
  $('#detail-name').textContent = rec.name || rec.id;
  $('#detail-kind').textContent = rec.short_kind || rec.kind;
  $('#detail-id').textContent = rec.id + (rec.version ? '  v' + rec.version : '');

  // Graph
  await renderGraph(rec);

  // Metadata
  renderMetadata(rec);

  // Table
  renderTable(rec.table_data);
}


// ══════════════════ MERMAID GRAPH ══════════════════

async function renderGraph(rec) {
  const nodes = new Map();  // id → { label, type, role }
  const edges = [];         // { from, to, label }

  // Center node
  const centerId = 'REC';
  const centerLabel = rec.name || shortId(rec.id);
  nodes.set(centerId, { label: centerLabel, type: rec.short_kind || 'ref', isSelf: true });

  // Build unique node id from OSDU record id
  function nodeKey(osduId) {
    return 'N' + Math.abs(hashCode(osduId));
  }
  function hashCode(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return h;
  }

  // Ancestry parents
  for (const pid of (rec.ancestry_parents || [])) {
    const key = nodeKey(pid);
    const info = (rec.linked_labels || {})[pid] || {};
    nodes.set(key, { label: info.name || shortId(pid), type: info.short_kind || 'ref', osduId: pid });
    edges.push({ from: key, to: centerId, label: 'parent' });
  }

  // Ancestry children
  for (const cid of (rec.ancestry_children || [])) {
    const key = nodeKey(cid);
    const info = (rec.linked_labels || {})[cid] || {};
    nodes.set(key, { label: info.name || shortId(cid), type: info.short_kind || 'ref', osduId: cid });
    edges.push({ from: centerId, to: key, label: 'child' });
  }

  // Data links (skip duplicates already in ancestry)
  const ancestrySet = new Set([...(rec.ancestry_parents || []), ...(rec.ancestry_children || [])]);
  for (const lnk of (rec.links || [])) {
    if (lnk.role === 'ancestry-parent' || lnk.role === 'ancestry-child') continue;
    const lid = lnk.id;
    const key = nodeKey(lid);
    if (!nodes.has(key)) {
      const info = (rec.linked_labels || {})[lid] || {};
      nodes.set(key, { label: info.name || shortId(lid), type: info.short_kind || lnk.role || 'ref', osduId: lid });
    }
    const roleLabel = (lnk.role || 'ref').replace(/-/g, ' ');
    edges.push({ from: centerId, to: key, label: roleLabel });
  }

  // Remove duplicate edges
  const edgeSet = new Set();
  const uniqueEdges = edges.filter(e => {
    const k = `${e.from}->${e.to}:${e.label}`;
    if (edgeSet.has(k)) return false;
    edgeSet.add(k);
    return true;
  });

  // Build Mermaid markup
  let md = 'graph LR\n';

  // classDefs
  const allTypes = new Set();
  nodes.forEach(n => allTypes.add(n.type));
  for (const t of allTypes) {
    const c = TYPE_COLORS[t] || ROLE_COLORS[t] || { fill: '#e9ecef', stroke: '#6c757d' };
    md += `classDef ${t.replace(/[^a-zA-Z0-9_]/g, '_')} fill:${c.fill},stroke:${c.stroke},color:#222\n`;
  }
  // Self highlight
  md += `classDef self_node fill:#0078d4,stroke:#005a9e,color:#fff,stroke-width:2px\n`;

  // Nodes
  nodes.forEach((n, key) => {
    const cls = n.isSelf ? 'self_node' : t2class(n.type);
    md += `${key}["${escMermaid(n.label)}"]:::${cls}\n`;
  });

  // Edges
  for (const e of uniqueEdges) {
    md += `${e.from} -->|${escMermaid(e.label)}| ${e.to}\n`;
  }

  // Click handlers for navigation
  nodes.forEach((n, key) => {
    if (n.osduId) {
      md += `click ${key} callback "${n.osduId}"\n`;
    }
  });

  const container = $('#mermaid-container');
  container.innerHTML = '';

  try {
    const graphId = 'graph_' + Date.now();
    const { svg } = await mermaid.render(graphId, md);
    container.innerHTML = svg;
    // Wire up click handlers
    container.querySelectorAll('.node').forEach(node => {
      node.style.cursor = 'pointer';
    });
  } catch (e) {
    console.warn('Mermaid render failed:', e);
    container.innerHTML = '<pre style="color:#666;font-size:.85rem">' + esc(md) + '</pre>';
  }

  // Handle clicks on graph nodes → navigate to that record
  container.addEventListener('click', (e) => {
    const node = e.target.closest('.node');
    if (!node) return;
    const nodeId = node.id?.replace(/^flowchart-/, '').replace(/-\d+$/, '');
    // Find which node was clicked
    for (const [key, n] of nodes) {
      if (n.osduId && nodeId && nodeId.startsWith(key)) {
        loadRecord(n.osduId);
        // Update results list selection
        $$('#results-list li').forEach(li => li.classList.remove('active'));
        break;
      }
    }
  });
}

function t2class(type) {
  return (type || 'ref').replace(/[^a-zA-Z0-9_]/g, '_');
}


// ══════════════════ METADATA ══════════════════

// Keys that go in the table, not in metadata
const TABLE_KEYS = new Set(['Volumes', 'Table', 'ColumnValues', 'ancestry']);
// Keys to organize into sections
const SECTION_MAP = {
  'Identity':     ['Name', 'Description', 'Summary', 'ProjectName', 'id', 'kind', 'version'],
  'Classification': ['TypeID', 'ApprovalStatusID', 'DecisionLevelID', 'Status'],
  'Dates':        ['EffectiveDateTime', 'DecisionDueDate', 'CreationDateTime', 'EndDateTime'],
};

function renderMetadata(rec) {
  const container = $('#meta-container');
  container.innerHTML = '';

  const data = rec.data || {};
  const labels = rec.linked_labels || {};

  // Flatten data to key-value pairs, skipping table data and ancestry
  const pairs = [];
  flattenObj(data, '', pairs);

  // Group into sections
  const sections = {
    'Identity':       [],
    'Details':        [],
    'References':     [],
    'Extensions':     [],
  };

  for (const p of pairs) {
    const topKey = p.name.split('.')[0];
    if (TABLE_KEYS.has(topKey)) continue;  // skip table data

    if (isOsduId(p.rawValue)) {
      sections['References'].push(p);
    } else if (p.name.startsWith('ext.') || p.name.startsWith('ext[')) {
      sections['Extensions'].push(p);
    } else if (['Name', 'Description', 'Summary', 'ProjectName'].includes(topKey)) {
      sections['Identity'].push(p);
    } else {
      sections['Details'].push(p);
    }
  }

  // Add record-level identity
  sections['Identity'].unshift(
    { name: 'Record ID', value: rec.id, rawValue: rec.id },
    { name: 'Kind', value: rec.kind, rawValue: rec.kind },
    { name: 'Version', value: rec.version ?? '—', rawValue: rec.version },
  );

  // Render each non-empty section
  for (const [title, items] of Object.entries(sections)) {
    if (!items.length) continue;
    const card = document.createElement('div');
    card.className = 'meta-card';
    let html = `<h4>${esc(title)}</h4><table>`;
    for (const p of items) {
      const val = formatValue(p.rawValue, p.name, labels);
      html += `<tr><td class="mk">${esc(p.name)}</td><td class="mv">${val}</td></tr>`;
    }
    html += '</table>';
    card.innerHTML = html;
    container.appendChild(card);
  }

  // Wire up OSDU link clicks in metadata
  container.querySelectorAll('a[data-osdu-id]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadRecord(a.dataset.osduId);
    });
  });
}

function flattenObj(obj, prefix, out) {
  if (obj === null || obj === undefined) return;
  if (typeof obj !== 'object') {
    out.push({ name: prefix, value: String(obj), rawValue: obj });
    return;
  }
  if (Array.isArray(obj)) {
    // Skip large numerical arrays (ColumnValues etc.)
    if (obj.length > 20 && obj.every(x => typeof x === 'number')) {
      out.push({ name: prefix, value: `[${obj.length} numbers]`, rawValue: obj });
      return;
    }
    // If array of scalars, join them
    if (obj.length <= 10 && obj.every(x => typeof x !== 'object')) {
      out.push({ name: prefix, value: obj.join(', '), rawValue: obj });
      return;
    }
    // Otherwise recurse
    for (let i = 0; i < obj.length; i++) {
      flattenObj(obj[i], prefix ? `${prefix}[${i}]` : `[${i}]`, out);
    }
    return;
  }
  // Object
  for (const [k, v] of Object.entries(obj)) {
    flattenObj(v, prefix ? `${prefix}.${k}` : k, out);
  }
}

function isOsduId(val) {
  if (typeof val !== 'string') return false;
  return /^[\w\-.]+:(?:(?:work-product(?:-component)?)|master-data)--[\w\-]+:[\w\-.:%]+:\d+$/.test(val.trim());
}

function formatValue(raw, name, labels) {
  if (raw === null || raw === undefined) return '<span class="muted">—</span>';
  if (typeof raw === 'boolean') return raw ? 'true' : 'false';
  if (typeof raw === 'number') return String(raw);
  if (typeof raw === 'string') {
    // OSDU ID → clickable link
    if (isOsduId(raw)) {
      const info = labels[raw] || {};
      const display = info.name || raw;
      const badge = info.short_kind ? ` <span class="res-kind" style="font-size:.7rem">${esc(info.short_kind)}</span>` : '';
      return `<a data-osdu-id="${esc(raw)}" href="#">${esc(display)}</a>${badge}`;
    }
    // URL
    if (/^https?:\/\//.test(raw)) {
      return `<a href="${esc(raw)}" target="_blank">${esc(raw.length > 80 ? raw.substring(0, 78) + '…' : raw)}</a>`;
    }
    return esc(raw);
  }
  if (Array.isArray(raw)) {
    return esc(raw.join(', '));
  }
  return esc(JSON.stringify(raw));
}


// ══════════════════ TABLE DATA ══════════════════

function renderTable(td) {
  const sec = $('#table-section');
  if (!td || !td.headers || !td.nrows) {
    sec.style.display = 'none';
    return;
  }
  sec.style.display = '';
  $('#table-title').textContent = td.source === 'Volumes' ? 'Volumes (ColumnBasedTable)' : 'Table Data (ColumnBasedTable)';
  $('#table-info').textContent = `${td.nrows} rows × ${td.headers.length} columns`;

  const thead = $('#table-head');
  const tbody = $('#table-body');
  const keySet = new Set(td.key_names || []);

  // Header row
  thead.innerHTML = '<tr>' + td.headers.map(h =>
    `<th>${esc(h)}</th>`
  ).join('') + '</tr>';

  // Column metadata row (UoM if available)
  const allCols = [...(td.KeyColumns || []), ...(td.Columns || [])];
  const colMeta = {};
  for (const c of allCols) {
    if (c.ColumnName) colMeta[c.ColumnName] = c;
  }
  const hasUom = td.headers.some(h => colMeta[h]?.UnitOfMeasure);
  if (hasUom) {
    thead.innerHTML += '<tr>' + td.headers.map(h => {
      const uom = colMeta[h]?.UnitOfMeasure || '';
      return `<th style="font-weight:normal;font-size:.75rem;color:#605e5c">${esc(uom)}</th>`;
    }).join('') + '</tr>';
  }

  // Data rows
  const cv = td.ColumnValues || {};
  let html = '';
  for (let i = 0; i < td.nrows; i++) {
    html += '<tr>';
    for (const h of td.headers) {
      const vals = cv[h] || [];
      const v = i < vals.length ? vals[i] : '—';
      const cls = keySet.has(h) ? ' class="key-col"' : '';
      html += `<td${cls}>${v ?? '—'}</td>`;
    }
    html += '</tr>';
  }
  tbody.innerHTML = html;

  // Table filter
  const filterInput = $('#table-filter');
  filterInput.value = '';
  filterInput.oninput = () => {
    const q = filterInput.value.toLowerCase();
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(r => {
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  };
}


// ══════════════════ METADATA FILTER & COPY ══════════════════

$('#meta-filter')?.addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase();
  $$('.meta-card tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});

$('#meta-copy')?.addEventListener('click', () => {
  const rows = [];
  $$('.meta-card tr').forEach(tr => {
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 2) {
      rows.push(`"${cells[0].textContent}","${cells[1].textContent}"`);
    }
  });
  navigator.clipboard?.writeText(rows.join('\n'))
    .then(() => { $('#meta-copy').textContent = 'Copied!'; setTimeout(() => { $('#meta-copy').textContent = 'Copy CSV'; }, 1500); })
    .catch(() => {});
});

</script>

{% endblock %}
