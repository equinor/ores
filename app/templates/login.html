<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sign In — ORES</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Segoe UI, Roboto, Arial, sans-serif; margin: 0; background: #f3f2f1; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); padding: 48px 40px; text-align: center; max-width: 380px; width: 100%; }
    h1 { color: #004578; font-size: 22px; margin: 0 0 8px; }
    p { color: #605e5c; font-size: 14px; margin: 0 0 28px; }
    .btn-login { display: inline-block; padding: 12px 32px; background: #0078d4; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; text-decoration: none; }
    .btn-login:hover { background: #106ebe; }
    .note { color: #a19f9d; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ORES — OSDU Explorer</h1>
    <p>Sign in with your Equinor account to continue.</p>
    <a class="btn-login" href="/login">Sign in with Microsoft</a>
    <div class="note">Uses Azure AD with PKCE — no passwords are stored by this app.</div>
  </div>
</body>
</html>
