apiVersion: v1
kind: ConfigMap
metadata:
  name: ores-config
  namespace: ores
  labels:
    app.kubernetes.io/name: ores
data:
  # ── Server / global settings ──
  LOG_LEVEL: "INFO"
  DEBUG: "False"
  DEFAULT_DATASPACE: "maap/drogon"
  WECO_DEFAULT_DATASPACE: "maap/weco"
  APP_KEY: "test-app"

  # Which instance to activate at startup
  DEFAULT_INSTANCE: "interop"

  # ── GraphQL deep-search (optional) ──
  # GRAPHQL_PG_CONN_STRING lives in secret.yaml (contains password).
  # When set, enables direct PostgreSQL queries against the OpenETPServer DB.
  # Without it, GraphQL queries fall back to the RDDMS REST API.

  # ── Auth redirect (set when behind a reverse proxy / ingress) ──
  # OIDC_REDIRECT_URI: "https://ores.equinor.com/auth/callback"

  # ────────────────────────────────────────────────────────────────
  # OSDU instances - non-secret config
  # Pattern: INSTANCE_<NAME>_<KEY>
  # Secrets (client IDs, tokens, client secrets) go in secret.yaml.
  # Tenant IDs are public identifiers and belong here.
  # ────────────────────────────────────────────────────────────────

  # ── "eqndev" - Equinor SWE dev, per-user PKCE (default) ──
  # Each user authenticates with their own Entra ID identity, giving
  # per-user permissions, audit trail, and token isolation.
  INSTANCE_EQNDEV_AUTH_MODE: "per_user_pkce"
  INSTANCE_EQNDEV_TENANT_ID: ""
  INSTANCE_EQNDEV_HOSTNAME: "equinorswedev.energy.azure.com"
  INSTANCE_EQNDEV_DATA_PARTITION_ID: "dev"
  INSTANCE_EQNDEV_AUTHORITY: "osdu"
  INSTANCE_EQNDEV_SCHEMA_SOURCE: "wks"
  INSTANCE_EQNDEV_DEFAULT_LEGAL_TAG: "dev-equinor-private-default"
  INSTANCE_EQNDEV_DEFAULT_OWNERS: "data.ores.owners@dev.dataservices.energy"
  INSTANCE_EQNDEV_DEFAULT_VIEWERS: "data.office.global.viewers@dev.dataservices.energy"
  INSTANCE_EQNDEV_DEFAULT_COUNTRIES: "NO"

  # ── "oresdev" - same OSDU backend as eqndev, uses ores-dev app (21b442a9) ──
  # INSTANCE_ORESDEV_TENANT_ID: "3aa4a235-b6e2-48d5-9195-7fcf05b459b0"
  # INSTANCE_ORESDEV_HOSTNAME: "equinorswedev.energy.azure.com"
  # INSTANCE_ORESDEV_DATA_PARTITION_ID: "dev"
  # INSTANCE_ORESDEV_AUTHORITY: "osdu"
  # INSTANCE_ORESDEV_SCHEMA_SOURCE: "wks"
  # INSTANCE_ORESDEV_DEFAULT_LEGAL_TAG: "dev-equinor-private-default"
  # INSTANCE_ORESDEV_DEFAULT_OWNERS: "data.default.owners@dev.dataservices.energy"
  # INSTANCE_ORESDEV_DEFAULT_VIEWERS: "data.default.viewers@dev.dataservices.energy"
  # INSTANCE_ORESDEV_DEFAULT_COUNTRIES: "NO"

  # ── "preship" - pre-ship M27 QA (Keycloak, refresh_token auth) ──
  INSTANCE_PRESHIP_AUTH_MODE: "refresh_token"
  INSTANCE_PRESHIP_HOSTNAME: "qa.osdu-m27.osdu-cimpl.opengroup.org"
  INSTANCE_PRESHIP_DATA_PARTITION_ID: "osdu"
  INSTANCE_PRESHIP_AUTHORITY: "osdu"
  INSTANCE_PRESHIP_SCHEMA_SOURCE: "wks"
  INSTANCE_PRESHIP_TOKEN_URL: "https://keycloak-qa.osdu-m27.osdu-cimpl.opengroup.org/realms/osdu/protocol/openid-connect/token"
  INSTANCE_PRESHIP_AUTHORIZE_URL: "https://keycloak-qa.osdu-m27.osdu-cimpl.opengroup.org/realms/osdu/protocol/openid-connect/auth"
  INSTANCE_PRESHIP_DEFAULT_LEGAL_TAG: "osdu-RDDMS-LegalTag"
  INSTANCE_PRESHIP_DEFAULT_OWNERS: "data.default.owners@osdu.group"
  INSTANCE_PRESHIP_DEFAULT_VIEWERS: "data.default.viewers@osdu.group"
  INSTANCE_PRESHIP_DEFAULT_COUNTRIES: "US"

  # ── "interop" - ADME Interop (client_credentials) ──
  INSTANCE_INTEROP_AUTH_MODE: "client_credentials"
  INSTANCE_INTEROP_HOSTNAME: "admeinterop.energy.azure.com"
  INSTANCE_INTEROP_DATA_PARTITION_ID: "opendes"
  INSTANCE_INTEROP_AUTHORITY: "osdu"
  INSTANCE_INTEROP_SCHEMA_SOURCE: "wks"
  INSTANCE_INTEROP_DEFAULT_LEGAL_TAG: "opendes-ReservoirDDMS-Legal-Tag"
  INSTANCE_INTEROP_DEFAULT_OWNERS: "data.default.owners@opendes.dataservices.energy"
  INSTANCE_INTEROP_DEFAULT_VIEWERS: "data.default.viewers@opendes.dataservices.energy"
  INSTANCE_INTEROP_DEFAULT_COUNTRIES: "US"

